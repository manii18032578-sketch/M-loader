








<!DOCTYPE html>
<html lang="en">
<head>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M LOADER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial;padding:18px}
main{max-width:480px;margin:auto}
h1{text-align:center;color:#d8ad50;letter-spacing:4px}
h2{font-size:18px;color:#d8ad50}
.card{background:#171717;border:1px solid #59451f;border-radius:12px;padding:16px;margin:15px 0}
input,select{width:100%;padding:13px;margin:8px 0;background:#080808;color:white;border:1px solid #755b2a;border-radius:7px}
button{padding:11px;background:#d0a447;color:#111;border:0;border-radius:7px;font-weight:bold;margin:5px 2px}
.red{background:#9c3030;color:white}
.gray{background:#333;color:white}
.hidden{display:none}
.small{font-size:12px;color:#aaa;word-break:break-all}
.key{color:#e5bd65;word-break:break-all}
.item{border-bottom:1px solid #444;padding:10px 0}
</style>
</head>
<body>
<main>
<h1>M LOADER</h1>
<p style="text-align:center;color:#aaa">OFFLINE ACCESS PANEL</p>

<section class="card" id="home">
<h2>SELECT LOGIN</h2>
<button onclick="show('adminLogin')">ADMIN LOGIN</button>
<button onclick="show('userLogin')">USER LOGIN</button>
</section>

<section class="card hidden" id="adminLogin">
<h2>ADMIN LOGIN</h2>
<input id="adminPassword" type="password" placeholder="Admin Password">
<button onclick="adminEnter()">LOGIN</button>
<button class="gray" onclick="show('home')">BACK</button>
<p class="small">Demo password: MKADMIN</p>
</section>

<section class="card hidden" id="userLogin">
<h2>USER LOGIN</h2>
<input id="accessKey" placeholder="Enter Access Key">
<button onclick="userEnter()">LOGIN</button>
<button class="gray" onclick="show('home')">BACK</button>
<p id="loginMessage" class="small"></p>
</section>

<section id="adminPanel" class="hidden">
<div class="card">
<h2>KEY GENERATOR</h2>
<select id="duration">
<option value="5">5 Hours</option>
<option value="12">12 Hours</option>
<option value="24">24 Hours</option>
<option value="168">7 Days</option>
<option value="720">1 Month (30 Days)</option>
</select>
<button onclick="generateKey()">GENERATE KEY</button>
<p id="newKey" class="key"></p>
</div>

<div class="card">
<h2>KEY MANAGEMENT</h2>
<div id="keys"></div>
</div>

<div class="card">
<h2>LOGIN HISTORY</h2>
<div id="history"></div>
</div>
<button class="gray" onclick="logout()">LOGOUT</button>
</section>

<section class="card hidden" id="userPanel">
<h2>ACCESS GRANTED</h2>
<p>Welcome to M LOADER.</p>
<p id="expiry" class="key"></p>
<button onclick="logout()">LOGOUT</button>
</section>
</main>

<script>
const DB="mloader_offline_keys";
const LOG="mloader_offline_history";

function read(k){return JSON.parse(localStorage.getItem(k)||"[]")}
function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
function show(id){
["home","adminLogin","userLogin","adminPanel","userPanel"].forEach(x=>
document.getElementById(x).classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}
function date(t){return new Date(t).toLocaleString()}
function adminEnter(){
if(document.getElementById("adminPassword").value!=="MKADMIN"){
alert("Wrong password");return;
}
show("adminPanel");renderKeys();renderHistory();
}
function generateKey(){
const hours=Number(document.getElementById("duration").value);
const key="ML-"+Math.random().toString(36).slice(2,7).toUpperCase()
+"-"+Math.random().toString(36).slice(2,7).toUpperCase();
const now=Date.now(),data=read(DB);
data.push({key,hours,created:now,expiry:now+hours*3600000});
write(DB,data);
document.getElementById("newKey").textContent=key;
renderKeys();
}
function renderKeys(){
const box=document.getElementById("keys");
box.innerHTML="";
read(DB).forEach((k,i)=>{
const div=document.createElement("div");
div.className="item";
const info=document.createElement("p");
info.className="small";
info.textContent=k.key+" | "+k.hours+" Hours | "+(Date.now()<k.expiry?"ACTIVE":"EXPIRED");
const copy=document.createElement("button");
copy.textContent="COPY KEY";
copy.onclick=()=>copyText(k.key);
const del=document.createElement("button");
del.textContent="DELETE";
del.className="red";
del.onclick=()=>{
if(confirm("Delete this key?")){
const d=read(DB);d.splice(i,1);write(DB,d);renderKeys();
}};
div.append(info,copy,del);
box.appendChild(div);
});
}
function copyText(value){
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(value).then(()=>alert("Copied"))
.catch(()=>prompt("Copy key:",value));
}else prompt("Copy key:",value);
}
function userEnter(){
const key=document.getElementById("accessKey").value.trim();
const item=read(DB).find(k=>k.key===key);
if(!item){document.getElementById("loginMessage").textContent="Invalid Access Key";return}
if(Date.now()>=item.expiry){
document.getElementById("loginMessage").textContent="Access Key Expired";return;
}
const agent=navigator.userAgent;
const history=read(LOG);
history.unshift({key,time:Date.now(),device:agent});
write(LOG,history.slice(0,100));
document.getElementById("expiry").textContent="Expires: "+date(item.expiry);
show("userPanel");

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>M LOADER</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080808;color:white;
 font-family:Arial,sans-serif;
}
header{
 text-align:center;padding:25px;
 background:#111;border-bottom:1px solid #333;
}
h1{letter-spacing:4px;color:#fff;margin:5px}
.subtitle{color:#999;font-size:12px}
.container{max-width:480px;margin:25px auto;padding:15px}
.card{
 background:#151515;border:1px solid #333;
 border-radius:14px;padding:20px;margin-bottom:18px;
}
h2{text-align:center;font-size:20px}
input,select{
 width:100%;padding:14px;margin:9px 0;
 background:#080808;color:white;
 border:1px solid #444;border-radius:8px;
}
button{
 padding:12px;border:0;border-radius:8px;
 background:white;color:black;font-weight:bold;
 cursor:pointer;margin:5px 0;
}
.primary{width:100%;background:#fff}
.secondary{background:#333;color:white}
.danger{background:#a40000;color:white}
.hidden{display:none}
.key{
 background:#222;padding:12px;border-radius:8px;
 margin:10px 0;overflow-wrap:anywhere;
}
.small{font-size:12px;color:#aaa}
.status{color:#55dd88;font-size:12px}
.item{border-bottom:1px solid #333;padding:10px 0}
</style>
</head>

<body>
<header>
<h1>M LOADER</h1>
<div class="subtitle">PREMIUM ACCESS PANEL</div>
</header>

<div class="container">

<div id="home" class="card">
<h2>WELCOME</h2>
<button class="primary" onclick="show('adminLogin')">ADMIN LOGIN</button>
<button class="primary secondary" onclick="show('userLogin')">USER LOGIN</button>
</div>

<div id="adminLogin" class="card hidden">
<h2>ADMIN LOGIN</h2>
<input id="adminPass" type="password" placeholder="Admin Password">
<button class="primary" onclick="adminLogin()">LOGIN</button>
<button class="secondary" onclick="show('home')">BACK</button>
</div>

<div id="userLogin" class="card hidden">
<h2>USER LOGIN</h2>
<input id="accessKey" placeholder="Enter Access Key">
<button class="primary" onclick="userLogin()">LOGIN</button>
<button class="secondary" onclick="show('home')">BACK</button>
<div id="loginMessage"></div>
</div>

<div id="dashboard" class="hidden">
<div class="card">
<h2>ADMIN DASHBOARD</h2>
<p class="small">Generate Access Key</p>
<select id="duration">
<option value="5">5 HOURS</option>
<option value="12">12 HOURS</option>
<option value="24">24 HOURS</option>
<option value="168">7 DAYS</option>
<option value="720">1 MONTH</option>
</select>
<button class="primary" onclick="generateKey()">GENERATE KEY</button>
<div id="generated"></div>
</div>

<div class="card">
<h2>KEY MANAGEMENT</h2>
<div id="keyList"></div>
</div>

<div class="card">
<h2>LOGIN HISTORY</h2>
<div id="history"></div>
<button class="danger primary" onclick="clearHistory()">CLEAR HISTORY</button>
</div>

<button class="primary secondary" onclick="logout()">LOGOUT</button>
</div>

<div id="userPanel" class="card hidden">
<h2>ACCESS GRANTED</h2>
<p class="status">Your access key is valid.</p>
<div id="expiryText"></div>
<button class="primary secondary" onclick="logout()">LOGOUT</button>
</div>

</div>

<script>
const ADMIN_PASSWORD="MKADMIN";
const KEY_STORAGE="mloader_offline_keys";
const HISTORY_STORAGE="mloader_offline_history";

function show(id){
 ["home","adminLogin","userLogin","dashboard","userPanel"]
 .forEach(x=>document.getElementById(x).classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
}

function getKeys(){
 return JSON.parse(localStorage.getItem(KEY_STORAGE)||"[]");
}
function saveKeys(data){
 localStorage.setItem(KEY_STORAGE,JSON.stringify(data));
}
function getHistory(){
 return JSON.parse(localStorage.getItem(HISTORY_STORAGE)||"[]");
}
function saveHistory(data){
 localStorage.setItem(HISTORY_STORAGE,JSON.stringify(data));
}

function adminLogin(){
 if(document.getElementById("adminPass").value===ADMIN_PASSWORD){
 show("dashboard");renderKeys();renderHistory();
 }else alert("Wrong Admin Password");
}

function generateKey(){
 const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
 let key="ML-";
 for(let i=0;i<12;i++)key+=chars[Math.floor(Math.random()*chars.length)];
 const hours=Number(document.getElementById("duration").value);
 const expiry=Date.now()+hours*60*60*1000;
 let keys=getKeys();
 keys.push({key,created:Date.now(),expiry,device:null});
 saveKeys(keys);
 document.getElementById("generated").innerHTML=
 '<div class="key">'+key+
 '<br><button onclick="copyKey(\''+key+'\')">COPY KEY</button></div>';
 renderKeys();
}

function copyKey(key){
 if(navigator.clipboard){
 navigator.clipboard.writeText(key).then(()=>alert("Key copied!"))
 .catch(()=>alert("Copy unavailable"));
 }else alert("Clipboard unavailable");
}

function deleteKey(key){
 if(!confirm("Delete this key?"))return;
 saveKeys(getKeys().filter(k=>k.key!==key));
 renderKeys();
}

function renderKeys(){
 let keys=getKeys();
 let html="";
 keys.forEach(k=>{
 let expired=Date.now()>k.expiry;
 html+='<div class="item"><b>'+k.key+'</b><br>'+
 '<span class="'+(expired?'small':'status')+'">'+
 (expired?'EXPIRED':'ACTIVE')+'</span><br>'+
 '<span class="small">Expires: '+new Date(k.expiry).toLocaleString()+
 '</span><br><button onclick="copyKey(\''+k.key+'\')">COPY</button>'+
 '<button class="danger" onclick="deleteKey(\''+k.key+'\')">DELETE</button></div>';
 });
 document.getElementById("keyList").innerHTML=html||"No keys generated.";
}

function userLogin(){
 const entered=document.getElementById("accessKey").value.trim().toUpperCase();
 let keys=getKeys();
 let found=keys.find(k=>k.key===entered);
 if(!found){
 document.getElementById("loginMessage").innerText="Invalid Access Key";
 return;
 }
 if(Date.now()>found.expiry){
 document.getElementById("loginMessage").innerText="Access Key Expired";
 return;
 }
 const device=navigator.userAgent;
 if(found.device && found.device!==device){
 document.getElementById("loginMessage").innerText="Key already registered on another browser.";
 return;
 }
 if(!found.device){
 found.device=device;
 saveKeys(keys);
 }
 let history=getHistory();
 history.unshift({
 key:entered,
 time:new Date().toLocaleString(),
 device:device
 });
 saveHistory(history);
 document.getElementById("expiryText").innerText=
 "Access expires: "+new Date(found.expiry).toLocaleString();
 show("userPanel");
}

function renderHistory(){
 let data=getHistory();
 document.getElementById("history").innerHTML=
 data.map(h=>'<div class="item"><b>'+h.key+'</b><br>'+
 '<span class="small">'+h.time+'</span><br>'+
 '<span class="small">'+h.device+'</span></div>').join("")
 ||"No login history.";
}

function clearHistory(){
 if(confirm("Clear all login history?")){
 saveHistory([]);renderHistory();
 }
}

function logout(){
 document.getElementById("adminPass").value="";
 document.getElementById("accessKey").value="";
 show("home");
}
</script>
</body>
</html>
